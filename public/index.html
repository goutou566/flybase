<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flybase</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .logo span { color: var(--accent); }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .breadcrumb {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--border); }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    button.ghost:hover { color: var(--text); border-color: var(--muted); }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .empty { padding: 48px; text-align: center; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(56, 189, 248, 0.05); }
    .name { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .name svg { flex-shrink: 0; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .actions button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }
    .actions button:hover { color: var(--text); }
    .actions button.danger:hover { color: var(--danger); border-color: var(--danger); }
    .size, .date { color: var(--muted); }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #fileInput { display: none; }
    .progress { display: none; margin-top: 12px; }
    .progress.show { display: block; }
    .progress-list { display: flex; flex-direction: column; gap: 8px; }
    .upload-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .upload-item.failed { border-color: var(--danger); }
    .upload-item .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .upload-item .fname {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upload-item .pct { font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .upload-item .pct.ok { color: #4ade80; }
    .upload-item .pct.err { color: var(--danger); }
    .bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar > div {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.15s linear;
    }
    .progress p { font-size: 12px; color: var(--muted); margin-top: 8px; }
    #downloadLogBtn { display: none; margin-top: 10px; font-size: 12px; padding: 6px 12px; }
    #downloadLogBtn.show { display: inline-block; }
    .log-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .log-modal.show { display: flex; }
    .log-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 720px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .log-panel header {
      position: static;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-panel pre {
      margin: 0;
      padding: 16px 18px;
      overflow: auto;
      flex: 1;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .log-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">fly<span>base</span></div>
    <div style="display:flex;gap:8px">
      <button class="ghost" id="passkeyBtn" style="display:none">Passkey 登录</button>
      <button class="ghost" id="logoutBtn" style="display:none">退出登录</button>
      <button class="ghost" id="refreshBtn">刷新</button>
      <button id="uploadBtn">上传文件</button>
    </div>
    <input type="file" id="fileInput" multiple />
  </header>

  <main>
    <div class="toolbar">
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>

    <div class="progress" id="progress">
      <div class="progress-list" id="progressList"></div>
      <p id="progressText"></p>
      <button class="ghost" id="downloadLogBtn" style="display:none">下载失败日志</button>
    </div>

    <div class="card">
      <div class="empty" id="empty">此目录为空，点击右上角「上传文件」</div>
      <table id="fileTable" style="display:none">
        <thead>
          <tr>
            <th>名称</th>
            <th>大小</th>
            <th>修改时间</th>
            <th style="text-align:right">操作</th>
          </tr>
        </thead>
        <tbody id="fileList"></tbody>
      </table>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <div class="log-modal" id="logModal">
    <div class="log-panel">
      <header>
        <span>本次上传日志</span>
        <button class="ghost" id="logCloseBtn" style="padding:4px 10px;font-size:12px">关闭</button>
      </header>
      <pre id="logContent"></pre>
      <div class="log-actions">
        <button class="ghost" id="logDownloadBtn">下载日志文件</button>
      </div>
    </div>
  </div>

  <div class="log-modal" id="shareModal">
    <div class="log-panel" style="max-width:560px">
      <header>
        <span>分享链接</span>
        <button class="ghost" id="shareCloseBtn" style="padding:4px 10px;font-size:12px">关闭</button>
      </header>
      <div style="padding:16px 18px">
        <input id="shareUrlInput" readonly
          style="width:100%;box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px" />
        <p style="font-size:12px;color:var(--muted);margin-top:8px">链接已生成，24 小时内有效。点击「复制」或手动拷贝。</p>
      </div>
      <div class="log-actions">
        <button id="shareCopyBtn">复制链接</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { startRegistration, startAuthentication, browserSupportsWebAuthn } from './vendor/simplewebauthn/esm/index.js';

    const SESSION_KEY = 'flybase_session';

    const state = {
      current: [], // folder path segments
      admin: false,
      session: localStorage.getItem(SESSION_KEY),
      passkeyRegistered: false,
    };

    function saveSession(token) {
      state.session = token;
      if (token) {
        localStorage.setItem(SESSION_KEY, token);
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }

    async function fetchPasskeyStatus() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        state.passkeyRegistered = !!data.registered;
        return data;
      } catch {
        state.passkeyRegistered = false;
        return { registered: false };
      }
    }

    function applyAdminUi() {
      $('uploadBtn').style.display = state.admin ? '' : 'none';
      $('passkeyBtn').style.display = state.admin ? 'none' : '';
      $('passkeyBtn').textContent = state.passkeyRegistered ? 'Passkey 登录' : '注册 Passkey';
      $('logoutBtn').style.display = state.admin ? '' : 'none';
      loadFiles();
    }

    function authHeaders(extra = {}) {
      const headers = { ...extra };
      if (state.admin && state.session) {
        headers.Authorization = 'Bearer ' + state.session;
      }
      return headers;
    }

    function authedFetch(url, options = {}) {
      options.headers = authHeaders(options.headers);
      return fetch(url, options);
    }

    function handleAuthLost() {
      saveSession(null);
      state.admin = false;
      applyAdminUi();
      toast('会话已过期，请重新登录');
    }

    async function registerPasskey() {
      if (!browserSupportsWebAuthn()) {
        toast('此浏览器不支持 Passkey');
        return;
      }
      try {
        const res = await fetch('/api/auth/register/options');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        const attResp = await startRegistration({ optionsJSON: data.options });
        const verifyRes = await fetch('/api/auth/register/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(attResp),
        });
        const verifyData = await verifyRes.json();
        if (!verifyRes.ok) throw new Error(verifyData.error || `HTTP ${verifyRes.status}`);
        toast('Passkey 注册成功，请登录');
        state.passkeyRegistered = true;
        applyAdminUi();
        loginWithPasskey();
      } catch (err) {
        toast('注册失败: ' + (err.message || err.name || '未知错误'));
      }
    }

    async function loginWithPasskey() {
      if (!browserSupportsWebAuthn()) {
        toast('此浏览器不支持 Passkey');
        return;
      }
      try {
        const res = await fetch('/api/auth/login/options');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        const attResp = await startAuthentication({ optionsJSON: data.options });
        const verifyRes = await fetch('/api/auth/login/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(attResp),
        });
        const verifyData = await verifyRes.json();
        if (!verifyRes.ok) throw new Error(verifyData.error || `HTTP ${verifyRes.status}`);
        saveSession(verifyData.sessionToken);
        state.admin = true;
        applyAdminUi();
        toast('已通过 Passkey 登录');
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          toast('已取消登录');
        } else {
          toast('登录失败: ' + (err.message || err.name || '未知错误'));
        }
      }
    }

    async function exitAdmin() {
      try {
        if (state.session) {
          await fetch('/api/auth/logout', {
            method: 'POST',
            headers: authHeaders(),
          });
        }
      } catch {}
      saveSession(null);
      state.admin = false;
      applyAdminUi();
    }

    function onPasskeyBtn() {
      if (state.passkeyRegistered) {
        loginWithPasskey();
      } else {
        registerPasskey();
      }
    }

    const $ = (id) => document.getElementById(id);
    const fileInput = $('fileInput');

    const ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>`;

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function currentPrefix() {
      return state.current.length ? state.current.join('/') + '/' : '';
    }

    function encodeKey(key) {
      return encodeURIComponent(key);
    }

    function formatSize(bytes) {
      if (bytes == null) return '—';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      let n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString();
    }

    function nameOf(key) {
      const parts = key.split('/');
      return parts[parts.length - 1] || parts[parts.length - 2] || '';
    }

    function renderBreadcrumb() {
      const bc = $('breadcrumb');
      let html = '<a href="#" data-ix="-1">根目录</a>';
      state.current.forEach((seg, i) => {
        html += `<span class="sep">/</span><a href="#" data-ix="${i}">${seg}</a>`;
      });
      bc.innerHTML = html;
      bc.querySelectorAll('a').forEach((a) => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const ix = parseInt(a.dataset.ix, 10);
          state.current = ix < 0 ? [] : state.current.slice(0, ix + 1);
          loadFiles();
        });
      });
    }

    async function loadFiles() {
      renderBreadcrumb();
      const prefix = currentPrefix();
      try {
        const res = await fetch(`/api/objects?prefix=${encodeURIComponent(prefix)}&_=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(await res.text());
        const { objects } = await res.json();

        const folders = new Map();
        const files = [];
        objects.forEach((obj) => {
          const rest = obj.key.slice(prefix.length);
          if (rest.includes('/')) {
            const folder = rest.split('/')[0];
            if (!folders.has(folder)) {
              folders.set(folder, obj.lastModified);
            }
          } else {
            files.push(obj);
          }
        });

        const tbody = $('fileList');
        const empty = $('empty');
        const table = $('fileTable');

        if (folders.size === 0 && files.length === 0) {
          table.style.display = 'none';
          empty.style.display = 'block';
          return;
        }

        table.style.display = '';
        empty.style.display = 'none';
        tbody.innerHTML = '';

        for (const [folder, lastModified] of folders) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>${folder}</span></td>
            <td class="size">—</td>
            <td class="date">${formatDate(lastModified)}</td>
            <td></td>`;
          tr.querySelector('.name').addEventListener('click', () => {
            state.current.push(folder);
            loadFiles();
          });
          tbody.appendChild(tr);
        }

        files.forEach((obj) => {
          const tr = document.createElement('tr');
          const key = obj.key;
          const name = nameOf(key);
          tr.innerHTML = `
            <td><span class="name">${ICON}<span class="fname"></span></span></td>
            <td class="size">${formatSize(obj.size)}</td>
            <td class="date">${formatDate(obj.lastModified)}</td>
            <td><div class="actions">
              <button data-act="download">下载</button>
              <button data-act="share">分享</button>
              ${state.admin ? '<button data-act="delete" class="danger">删除</button>' : ''}
            </div></td>`;
          tr.querySelector('.fname').textContent = name;
          tr.querySelector('.name').addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = `/api/objects/${encodeKey(key)}`;
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
          });
          const actions = tr.querySelector('.actions');
          actions.querySelector('[data-act=download]').addEventListener('click', () => {
            startDownload(key, name, obj.size);
          });
          actions.querySelector('[data-act=share]').addEventListener('click', async () => {
            try {
              const res = await fetch(`/api/objects/${encodeKey(key)}/share?expires=86400`);
              if (!res.ok) throw new Error(await res.text());
              const { shareUrl } = await res.json();
              openShareModal(shareUrl);
            } catch (err) {
              toast('生成分享链接失败: ' + (err.message || '').slice(0, 60));
            }
          });
          const delBtn = actions.querySelector('[data-act=delete]');
          if (delBtn) {
            delBtn.addEventListener('click', async () => {
              if (!confirm(`确认删除「${name}」？`)) return;
              try {
                // 预签名直删 Filebase：写请求绕开 CF 对 API 的挑战拦截
                const res = await authedFetch(`/api/objects/${encodeKey(key)}/presign-delete`);
                if (!res.ok) throw new Error(`获取删除签名失败 HTTP ${res.status}`);
                const { presignedUrl } = await res.json();
                const del = await fetch(presignedUrl, { method: 'DELETE' });
                if (!del.ok && del.status !== 204) {
                  throw new Error(`HTTP ${del.status}`);
                }
                toast('已删除');
                loadFiles();
              } catch (err) {
                const detail = err && err.message ? err.message.slice(0, 60) : '';
                toast(detail ? `删除失败: ${detail}` : '删除失败');
              }
            });
          }
          tbody.appendChild(tr);
        });
      } catch (err) {
        toast('加载文件列表失败: ' + err.message);
      }
    }

    async function uploadOne(file, key, onProgress) {
      // 先向 Worker 要预签名 URL（GET，可过 CF 挑战），再直传 Filebase（绕开 CF 对写请求的拦截）
      const res = await authedFetch(`/api/objects/${encodeKey(key)}/presign-put`);
      if (!res.ok) throw new Error(`获取直传签名失败 HTTP ${res.status}`);
      const { presignedUrl } = await res.json();
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', presignedUrl);
        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) onProgress(e.loaded, e.total);
        });
        xhr.addEventListener('load', () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve();
          } else {
            reject(new Error(`HTTP ${xhr.status}: ${xhr.responseText.slice(0, 200)}`));
          }
        });
        xhr.addEventListener('error', () => reject(new Error('网络错误')));
        xhr.addEventListener('timeout', () => reject(new Error('请求超时')));
        xhr.send(file);
      });
    }

    async function uploadWithRetry(file, key, onProgress, maxRetries = 2) {
      let lastErr;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          await uploadOne(file, key, onProgress);
          return;
        } catch (err) {
          lastErr = err;
          if (attempt < maxRetries) {
            const waitMs = 1500 * (attempt + 1);
            pushLog(`${file.name} 第 ${attempt + 1} 次尝试失败（${waitMs / 1000}s 后重试）: ${err.message}`);
            onProgress(0, file.size, `重试 ${attempt + 1}/${maxRetries}（${waitMs / 1000}s 后）`);
            await new Promise((r) => setTimeout(r, waitMs));
          }
        }
      }
      throw lastErr;
    }

    // ---- 多线程下载 ----
    const DL_MIN_SIZE = 8 * 1024 * 1024;   // 8MB 以上走多线程 Range 下载
    const DL_MAX_CONNECTIONS = 16;
    const DL_CHUNK_SIZE = 8 * 1024 * 1024; // 每个连接负责约 8MB

    function showDownloadProgress(name, loaded, total, note) {
      const box = $('progress');
      const listBox = $('progressList');
      box.classList.add('show');
      let el = listBox.querySelector(`[data-dl="${CSS.escape(name)}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'upload-item';
        el.dataset.dl = name;
        el.innerHTML = `
          <div class="row">
            <span class="fname"></span>
            <span class="pct">0%</span>
          </div>
          <div class="bar"><div></div></div>`;
        listBox.prepend(el);
      }
      const fill = el.querySelector('.bar > div');
      const pct = el.querySelector('.pct');
      if (note) {
        pct.textContent = note;
        return;
      }
      const p = total ? Math.round((loaded / total) * 100) : 0;
      fill.style.width = `${p}%`;
      pct.textContent = `${formatBytes(loaded)} / ${formatBytes(total)}`;
      if (loaded >= total) {
        pct.textContent = '完成';
        pct.classList.add('ok');
        setTimeout(() => {
          el.remove();
          if (!listBox.children.length) box.classList.remove('show');
        }, 3000);
      }
    }

    async function startDownload(key, name, size) {
      if (size <= DL_MIN_SIZE) {
        // 小文件：单次拉取进内存，仍经 SW 桥保存（避免导航式下载被 CF 挑战页污染）
        try {
          showDownloadProgress(name, 0, size, '下载中...');
          const res = await fetch(`/api/objects/${encodeKey(key)}?dl=1`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          if ((res.headers.get('content-type') || '').includes('text/html')) {
            throw new Error('收到挑战页而非文件');
          }
          const blob = await res.blob();
          await saveBlobAs(blob, name);
          showDownloadProgress(name, size, size);
          return;
        } catch (err) {
          toast(`下载失败: ${(err.message || '未知错误').slice(0, 60)}`);
          pushLog(`${name} 下载失败: ${err.message}`);
          const el = $('progressList').querySelector(`[data-dl="${CSS.escape(name)}"]`);
          if (el) el.querySelector('.pct').textContent = '失败';
          return;
        }
      }
      try {
        showDownloadProgress(name, 0, size, '准备中...');
        const res = await fetch(`/api/objects/${encodeKey(key)}/share?expires=3600`);
        if (!res.ok) throw new Error(`获取直链失败 HTTP ${res.status}`);
        const { shareUrl } = await res.json();

        const chunkCount = Math.min(DL_MAX_CONNECTIONS, Math.ceil(size / DL_CHUNK_SIZE));
        const perChunk = Math.ceil(size / chunkCount);
        const buffers = new Array(chunkCount).fill(null);
        let doneBytes = 0;

        const fetchChunk = async (idx) => {
          const start = idx * perChunk;
          const end = Math.min(start + perChunk, size) - 1;
          let lastErr;
          for (let attempt = 0; attempt <= 3; attempt++) {
            try {
              const r = await fetch(shareUrl, { headers: { Range: `bytes=${start}-${end}` } });
              if (!r.ok && r.status !== 206) throw new Error(`HTTP ${r.status}`);
              const buf = await r.arrayBuffer();
              buffers[idx] = buf;
              doneBytes += buf.byteLength;
              showDownloadProgress(name, doneBytes, size);
              return;
            } catch (err) {
              lastErr = err;
              if (attempt < 3) {
                pushLog(`${name} 分块 ${idx + 1}/${chunkCount} 失败，重试: ${err.message}`);
                await new Promise((rr) => setTimeout(rr, 1000 * Math.pow(2, attempt)));
              }
            }
          }
          throw lastErr;
        };

        const queue = Array.from({ length: chunkCount }, (_, i) => i);
        await Promise.all(
          Array.from({ length: Math.min(6, chunkCount) }, async () => {
            while (queue.length) {
              const idx = queue.shift();
              await fetchChunk(idx);
            }
          })
        );

        const blob = new Blob(buffers, { type: mimeOf(name) });
        await saveBlobAs(blob, name);
        pushLog(`${name} 多线程下载完成（${chunkCount} 连接）`);
      } catch (err) {
        toast(`下载失败: ${(err.message || '未知错误').slice(0, 60)}`);
        pushLog(`${name} 多线程下载失败: ${err.message}`);
        const el = $('progressList').querySelector(`[data-dl="${CSS.escape(name)}"]`);
        if (el) {
          const pct = el.querySelector('.pct');
          pct.textContent = '失败';
          pct.classList.add('err');
        }
      }
    }

    // ---- 失败日志 ----
    const uploadLogEntries = [];

    function pushLog(msg) {
      uploadLogEntries.push(`[${new Date().toISOString()}] ${msg}`);
    }

    function buildLogText() {
      const lines = [
        'flybase 上传日志',
        `时间: ${new Date().toISOString()}`,
        `页面: ${location.href}`,
        `浏览器: ${navigator.userAgent}`,
        `配置: 分片阈值 ${formatBytes(MULTIPART_THRESHOLD)} / 片大小 ${formatBytes(PART_SIZE)} / 分片并发 ${PART_CONCURRENCY}`,
        '='.repeat(60),
        ...uploadLogEntries,
      ];
      return lines.join('\n');
    }

    function downloadUploadLog() {
      const blob = new Blob([buildLogText()], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ts = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19);
      a.href = url;
      a.download = `flybase-upload-log-${ts}.log`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    function formatBytes(n) {
      return formatSize(n);
    }

    const MULTIPART_THRESHOLD = 8 * 1024 * 1024;  // 8MB 以上走分片直传（Worker 中转有体积/内存限制）
    const PART_SIZE = 8 * 1024 * 1024;            // 每片 8MB
    const PART_CONCURRENCY = 4;
    const PRESIGN_BATCH = 16;                     // 批量预取签名数

    async function mpRequest(path, options = {}) {
      const headers = authHeaders(options.headers);
      const res = await fetch(path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        handleAuthLost();
        throw new Error('登录已过期');
      }
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function uploadPartWithRetry(presignPath, blob, onPartProgress, maxRetries = 4, label = '') {
      let lastErr;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          return await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', presignPath);
            xhr.upload.addEventListener('progress', (e) => {
              if (e.lengthComputable) onPartProgress(e.loaded);
            });
            xhr.addEventListener('load', () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve(xhr.getResponseHeader('ETag') || '');
              } else {
                reject(new Error(`HTTP ${xhr.status}`));
              }
            });
            xhr.addEventListener('error', () => reject(new Error('网络错误')));
            xhr.addEventListener('timeout', () => reject(new Error('超时')));
            xhr.send(blob);
          });
        } catch (err) {
          lastErr = err;
          if (attempt < maxRetries) {
            const waitMs = 1000 * Math.pow(2, attempt);
            pushLog(`${label} 第 ${attempt + 1} 次尝试失败（${waitMs / 1000}s 后重试）: ${err.message}`);
            onPartProgress(0);
            await new Promise((r) => setTimeout(r, waitMs));
          }
        }
      }
      throw lastErr;
    }

    async function uploadMultipart(file, key, onProgress, onNote, signalRef) {
      // init：拿预签名 CreateMultipartUpload URL，浏览器直发 POST 到 Filebase，从 XML 解析 uploadId
      const initRes = await mpRequest(`/api/multipart/${encodeKey(key)}?action=presign-init`);
      const xmlText = await fetch(initRes.presignedUrl, { method: 'POST' }).then(async (r) => {
        if (!r.ok) throw new Error(`初始化分片失败 HTTP ${r.status}`);
        return r.text();
      });
      const initDoc = new DOMParser().parseFromString(xmlText, 'text/xml');
      const uploadId = initDoc.querySelector('UploadId')?.textContent;
      if (!uploadId) throw new Error('初始化分片失败: 无 UploadId');
      pushLog(`${file.name} 分片上传已初始化（直连 Filebase）`);

      signalRef.abort = async () => {
        try {
          const a = await mpRequest(
            `/api/multipart/${encodeKey(key)}?action=presign-abort&uploadId=${encodeURIComponent(uploadId)}`
          );
          await fetch(a.presignedUrl, { method: 'POST' });
        } catch {}
      };

      const totalParts = Math.ceil(file.size / PART_SIZE);
      const parts = new Array(totalParts).fill(null);
      let completedBytes = 0;
      const partLoaded = new Array(totalParts).fill(0);

      const updateTotal = () => onProgress(completedBytes + partLoaded.reduce((a, b) => a + b, 0), file.size);

      // 批量预取签名流水线：PUT 并发槽从 signQueue 取签名，队列低于水位时后台批量补货
      const signQueue = [];
      let nextSignPart = 1; // 1-based
      let prefetching = null;

      async function refillSignQueue() {
        if (prefetching) return prefetching;
        const need = Math.min(PRESIGN_BATCH, totalParts - nextSignPart + 1);
        if (need <= 0) return;
        prefetching = (async () => {
          try {
            const res = await mpRequest(
              `/api/multipart/${encodeKey(key)}?action=presign-batch&uploadId=${encodeURIComponent(uploadId)}&start=${nextSignPart}&count=${need}`
            );
            for (const item of res.items) signQueue.push(item);
            nextSignPart += res.items.length;
          } catch (err) {
            pushLog(`${file.name} 预取签名失败（第 ${nextSignPart} 片起）: ${err.message}`);
          } finally {
            prefetching = null;
          }
        })();
        return prefetching;
      }

      async function takePresign() {
        while (!signQueue.length && nextSignPart <= totalParts) {
          await refillSignQueue();
          if (prefetching) await prefetching;
        }
        return signQueue.shift();
      }

      const worker = async (queue) => {
        while (queue.length) {
          const i = queue.shift();
          const start = i * PART_SIZE;
          const blob = file.slice(start, Math.min(start + PART_SIZE, file.size));
          try {
            const signed = await takePresign();
            if (!signed || signed.partNumber !== i + 1) {
              // 兜底：预取错位或缺失时单独补签该分片
              const r = await mpRequest(
                `/api/multipart/${encodeKey(key)}?action=presign&uploadId=${encodeURIComponent(uploadId)}&partNumber=${i + 1}`
              );
              signed = { partNumber: i + 1, presignedUrl: r.presignedUrl };
            }
            const etag = await uploadPartWithRetry(signed.presignedUrl, blob, (loaded) => {
              partLoaded[i] = loaded;
              updateTotal();
            }, 4, `${file.name} 第 ${i + 1}/${totalParts} 片`);
            parts[i] = { partNumber: i + 1, etag };
            partLoaded[i] = blob.size;
            completedBytes += blob.size;
            partLoaded[i] = 0;
            updateTotal();
            refillSignQueue();
          } catch (err) {
            pushLog(`${file.name} 第 ${i + 1} 片最终失败，已中止整个上传: ${err.message}`);
            if (signalRef.abort) await signalRef.abort();
            throw new Error(`第 ${i + 1} 片上传失败: ${err.message}`);
          }
        }
      };

      const queue = Array.from({ length: totalParts }, (_, i) => i);
      await Promise.all(
        Array.from({ length: Math.min(PART_CONCURRENCY, totalParts) }, () => worker(queue))
      );

      onNote?.('正在合并分片...');
      const okParts = parts.filter(Boolean).sort((a, b) => a.partNumber - b.partNumber);
      const completeXml =
        '<CompleteMultipartUpload>' +
        okParts
          .map((p) => `<Part><PartNumber>${p.partNumber}</PartNumber><ETag>${p.etag}</ETag></Part>`)
          .join('') +
        '</CompleteMultipartUpload>';
      const c = await mpRequest(
        `/api/multipart/${encodeKey(key)}?action=presign-complete&uploadId=${encodeURIComponent(uploadId)}`
      );
      const cRes = await fetch(c.presignedUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/xml' },
        body: completeXml,
      });
      if (!cRes.ok) throw new Error(`合并分片失败 HTTP ${cRes.status}`);
      const cText = await cRes.text();
      if (/<Error>/i.test(cText) || /<Code>/i.test(cText)) {
        throw new Error(`合并分片失败: ${cText.slice(0, 200)}`);
      }
    }

    async function uploadFiles(files) {
      const list = Array.from(files);
      const progress = $('progress');
      const listBox = $('progressList');
      const text = $('progressText');
      const logBtn = $('downloadLogBtn');
      progress.classList.add('show');
      logBtn.classList.remove('show');
      uploadLogEntries.length = 0;
      pushLog(`开始上传批次，共 ${list.length} 个文件`);

      const items = list.map((file) => {
        const el = document.createElement('div');
        el.className = 'upload-item';
        el.innerHTML = `
          <div class="row">
            <span class="fname"></span>
            <span class="pct">0%</span>
          </div>
          <div class="bar"><div></div></div>`;
        el.querySelector('.fname').textContent =
          `${file.name}（${formatBytes(file.size)}${file.size > MULTIPART_THRESHOLD ? '，分片直传' : ''}）`;
        listBox.appendChild(el);
        return { file, el };
      });

      let okCount = 0;
      const failNames = [];

      // 串行上传：避免多文件并发打满连接导致分片失败
      for (const { file, el } of items) {
        const key = currentPrefix() + file.name;
        const fill = el.querySelector('.bar > div');
        const pct = el.querySelector('.pct');
        const signalRef = {};
        const showProgress = (loaded, total, note) => {
          if (note) {
            pct.textContent = note;
            fill.style.width = '100%';
            fill.style.opacity = '0.3';
            return;
          }
          const p = total ? Math.round((loaded / total) * 100) : 0;
          fill.style.width = `${p}%`;
          fill.style.opacity = '';
          pct.textContent = `${formatBytes(loaded)} / ${formatBytes(total)}`;
        };
        try {
          pushLog(`—— 开始上传 ${file.name}（${formatBytes(file.size)}，${file.size > MULTIPART_THRESHOLD ? '分片直传' : 'Worker 中转'}）`);
          if (file.size > MULTIPART_THRESHOLD) {
            await uploadMultipart(file, key, showProgress, (note) => showProgress(0, 0, note), signalRef);
          } else {
            await uploadWithRetry(file, key, showProgress);
          }
          fill.style.width = '100%';
          pct.textContent = '完成';
          pct.classList.add('ok');
          okCount++;
          pushLog(`${file.name} 上传成功`);
        } catch (err) {
          el.classList.add('failed');
          pct.textContent = '失败: ' + (err.message || '未知错误').slice(0, 80);
          pct.classList.add('err');
          failNames.push(file.name);
          pushLog(`${file.name} 上传失败: ${err.message || '未知错误'}`);
        }
      }

      if (failNames.length === 0) {
        text.textContent = `全部完成（${okCount} 个文件）`;
        setTimeout(() => {
          progress.classList.remove('show');
          listBox.innerHTML = '';
          logBtn.classList.remove('show');
        }, 4000);
      } else {
        text.textContent = `成功 ${okCount}/${list.length}，失败：${failNames.join('、')}`;
        logBtn.classList.add('show');
      }
      pushLog(`批次结束：成功 ${okCount}/${list.length}`);
      showLogModal();
      loadFiles();
    }

    function showLogModal() {
      $('logContent').textContent = buildLogText();
      $('logModal').classList.add('show');
    }

    function hideLogModal() {
      $('logModal').classList.remove('show');
    }

    let currentShareUrl = '';

    function openShareModal(url) {
      currentShareUrl = url;
      const input = $('shareUrlInput');
      input.value = url;
      $('shareModal').classList.add('show');
      input.focus();
      input.select();
    }

    async function copyShareLink() {
      const input = $('shareUrlInput');
      let copied = false;
      try {
        await navigator.clipboard.writeText(currentShareUrl);
        copied = true;
      } catch {}
      if (!copied) {
        input.focus();
        input.select();
        try {
          copied = document.execCommand('copy');
        } catch {}
      }
      toast(copied ? '分享链接已复制（24 小时有效）' : '自动复制失败，请手动拷贝');
      if (copied) hideShareModal();
    }

    function hideShareModal() {
      $('shareModal').classList.remove('show');
    }

    $('uploadBtn').addEventListener('click', () => fileInput.click());
    $('refreshBtn').addEventListener('click', loadFiles);
    $('passkeyBtn').addEventListener('click', onPasskeyBtn);
    $('logoutBtn').addEventListener('click', exitAdmin);
    $('downloadLogBtn').addEventListener('click', downloadUploadLog);
    $('logCloseBtn').addEventListener('click', hideLogModal);
    $('logDownloadBtn').addEventListener('click', downloadUploadLog);
    $('logModal').addEventListener('click', (e) => {
      if (e.target === $('logModal')) hideLogModal();
    });
    $('shareCopyBtn').addEventListener('click', copyShareLink);
    $('shareCloseBtn').addEventListener('click', hideShareModal);
    $('shareModal').addEventListener('click', (e) => {
      if (e.target === $('shareModal')) hideShareModal();
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) uploadFiles(e.target.files);
      e.target.value = '';
    });

    // ---- SW 下载桥：让浏览器原生下载器接管文件名（Safari 对异步 blob URL 会忽略 download 属性并按 text/html 另存为 .html）----
    const swReady = navigator.serviceWorker
      .register('/sw.js')
      .then(() => navigator.serviceWorker.ready)
      .catch(() => null);

    function mimeOf(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      const map = {
        png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
        webp: 'image/webp', svg: 'image/svg+xml', pdf: 'application/pdf',
        txt: 'text/plain', md: 'text/plain', log: 'text/plain', csv: 'text/plain',
        json: 'application/json', zip: 'application/zip',
        exe: 'application/vnd.microsoft.portable-executable',
        msi: 'application/x-msdownload', apk: 'application/vnd.android.package-archive',
        pkg: 'application/x-newton-compatible-pkg', dmg: 'application/x-apple-diskimage',
        mp4: 'video/mp4', mp3: 'audio/mpeg',
      };
      return map[ext] || 'application/octet-stream';
    }

    async function saveBlobAs(blob, filename) {
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          const token = crypto.randomUUID();
          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error('SW 响应超时')), 8000);
            navigator.serviceWorker.addEventListener('message', function onMsg(e) {
              if (e.data && e.data.type === 'download-ready' && e.data.token === token) {
                navigator.serviceWorker.removeEventListener('message', onMsg);
                clearTimeout(timer);
                resolve();
              }
            });
            navigator.serviceWorker.controller.postMessage({
              type: 'download',
              token,
              blob,
              filename,
              mime: mimeOf(filename),
              size: blob.size,
            });
          });
          const iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = `/__download/${token}`;
          document.body.appendChild(iframe);
          setTimeout(() => iframe.remove(), 120000);
          return;
        }
      } catch (err) {
        pushLog(`SW 下载桥失败，回退 blob 方式: ${err.message}`);
      }
      // 回退路径
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    async function init() {
      await fetchPasskeyStatus();
      state.admin = !!state.session;
      applyAdminUi();
      loadFiles();
    }

    init();
  </script>
</body>
</html>

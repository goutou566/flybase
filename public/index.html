<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flybase</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .logo span { color: var(--accent); }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .breadcrumb {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--border); }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    button.ghost:hover { color: var(--text); border-color: var(--muted); }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .empty { padding: 48px; text-align: center; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(56, 189, 248, 0.05); }
    .name { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .name svg { flex-shrink: 0; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .actions button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }
    .actions button:hover { color: var(--text); }
    .actions button.danger:hover { color: var(--danger); border-color: var(--danger); }
    .size, .date { color: var(--muted); }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #fileInput { display: none; }
    .progress { display: none; margin-top: 12px; }
    .progress.show { display: block; }
    .bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar > div {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.2s;
    }
    .progress p { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">fly<span>base</span></div>
    <div style="display:flex;gap:8px">
      <button class="ghost" id="adminBtn" style="display:none">管理员登录</button>
      <button class="ghost" id="exitAdminBtn" style="display:none">退出管理</button>
      <button class="ghost" id="refreshBtn">刷新</button>
      <button id="uploadBtn">上传文件</button>
    </div>
    <input type="file" id="fileInput" multiple />
  </header>

  <main>
    <div class="toolbar">
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>

    <div class="progress" id="progress">
      <div class="bar"><div id="progressFill"></div></div>
      <p id="progressText"></p>
    </div>

    <div class="card">
      <div class="empty" id="empty">此目录为空，点击右上角「上传文件」</div>
      <table id="fileTable" style="display:none">
        <thead>
          <tr>
            <th>名称</th>
            <th>大小</th>
            <th>修改时间</th>
            <th style="text-align:right">操作</th>
          </tr>
        </thead>
        <tbody id="fileList"></tbody>
      </table>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      current: [], // folder path segments
      admin: false,
      authHeader: null,
    };

    function enterAdmin() {
      const pass = prompt('请输入管理员密码');
      if (!pass) return;
      state.admin = true;
      state.authHeader = 'Basic ' + btoa('admin:' + pass);
      applyAdminUi();
      toast('管理员模式已开启');
    }

    function exitAdmin() {
      state.admin = false;
      state.authHeader = null;
      applyAdminUi();
    }

    function applyAdminUi() {
      $('uploadBtn').style.display = state.admin ? '' : 'none';
      $('adminBtn').style.display = state.admin ? 'none' : '';
      $('exitAdminBtn').style.display = state.admin ? '' : 'none';
      loadFiles();
    }

    function authedFetch(url, options = {}) {
      if (state.admin && state.authHeader) {
        options.headers = { ...(options.headers || {}), Authorization: state.authHeader };
      }
      return fetch(url, options);
    }

    const $ = (id) => document.getElementById(id);
    const fileInput = $('fileInput');

    const ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>`;

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function currentPrefix() {
      return state.current.length ? state.current.join('/') + '/' : '';
    }

    function encodeKey(key) {
      return encodeURIComponent(key);
    }

    function formatSize(bytes) {
      if (bytes == null) return '—';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      let n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString();
    }

    function nameOf(key) {
      const parts = key.split('/');
      return parts[parts.length - 1] || parts[parts.length - 2] || '';
    }

    function renderBreadcrumb() {
      const bc = $('breadcrumb');
      let html = '<a href="#" data-ix="-1">根目录</a>';
      state.current.forEach((seg, i) => {
        html += `<span class="sep">/</span><a href="#" data-ix="${i}">${seg}</a>`;
      });
      bc.innerHTML = html;
      bc.querySelectorAll('a').forEach((a) => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const ix = parseInt(a.dataset.ix, 10);
          state.current = ix < 0 ? [] : state.current.slice(0, ix + 1);
          loadFiles();
        });
      });
    }

    async function loadFiles() {
      renderBreadcrumb();
      const prefix = currentPrefix();
      try {
        const res = await fetch(`/api/objects?prefix=${encodeURIComponent(prefix)}`);
        if (!res.ok) throw new Error(await res.text());
        const { objects } = await res.json();

        const folders = new Map();
        const files = [];
        objects.forEach((obj) => {
          const rest = obj.key.slice(prefix.length);
          if (rest.includes('/')) {
            const folder = rest.split('/')[0];
            if (!folders.has(folder)) {
              folders.set(folder, obj.lastModified);
            }
          } else {
            files.push(obj);
          }
        });

        const tbody = $('fileList');
        const empty = $('empty');
        const table = $('fileTable');

        if (folders.size === 0 && files.length === 0) {
          table.style.display = 'none';
          empty.style.display = 'block';
          return;
        }

        table.style.display = '';
        empty.style.display = 'none';
        tbody.innerHTML = '';

        for (const [folder, lastModified] of folders) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>${folder}</span></td>
            <td class="size">—</td>
            <td class="date">${formatDate(lastModified)}</td>
            <td></td>`;
          tr.querySelector('.name').addEventListener('click', () => {
            state.current.push(folder);
            loadFiles();
          });
          tbody.appendChild(tr);
        }

        files.forEach((obj) => {
          const tr = document.createElement('tr');
          const key = obj.key;
          const name = nameOf(key);
          tr.innerHTML = `
            <td><span class="name">${ICON}<span></span></span></td>
            <td class="size">${formatSize(obj.size)}</td>
            <td class="date">${formatDate(obj.lastModified)}</td>
            <td><div class="actions">
              <button data-act="download">下载</button>
              <button data-act="share">分享</button>
              ${state.admin ? '<button data-act="delete" class="danger">删除</button>' : ''}
            </div></td>`;
          tr.querySelector('.name span span').textContent = name;
          tr.querySelector('.name').addEventListener('click', () => {
            window.open(`/api/objects/${encodeKey(key)}`, '_blank');
          });
          const actions = tr.querySelector('.actions');
          actions.querySelector('[data-act=download]').addEventListener('click', () => {
            window.open(`/api/objects/${encodeKey(key)}`, '_blank');
          });
          actions.querySelector('[data-act=share]').addEventListener('click', async () => {
            try {
              const res = await fetch(`/api/objects/${encodeKey(key)}/share?expires=86400`);
              if (!res.ok) throw new Error(await res.text());
              const { shareUrl } = await res.json();
              await navigator.clipboard.writeText(shareUrl);
              toast('分享链接已复制（24 小时有效）');
            } catch {
              toast('生成分享链接失败');
            }
          });
          const delBtn = actions.querySelector('[data-act=delete]');
          if (delBtn) {
            delBtn.addEventListener('click', async () => {
              if (!confirm(`确认删除「${name}」？`)) return;
              try {
                const res = await authedFetch(`/api/objects/${encodeKey(key)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                toast('已删除');
                loadFiles();
              } catch {
                toast('删除失败');
              }
            });
          }
          tbody.appendChild(tr);
        });
      } catch (err) {
        toast('加载文件列表失败: ' + err.message);
      }
    }

    async function uploadFiles(files) {
      const total = files.length;
      let done = 0;
      const progress = $('progress');
      const fill = $('progressFill');
      const text = $('progressText');
      progress.classList.add('show');

      for (const file of files) {
        const key = currentPrefix() + file.name;
        fill.style.width = '0%';
        text.textContent = `上传中 ${file.name}...`;
        try {
          const res = await authedFetch(`/api/objects/${encodeKey(key)}`, {
            method: 'PUT',
            body: file,
          });
          if (!res.ok) throw new Error(await res.text());
        } catch (err) {
          toast(`上传 ${file.name} 失败: ${err.message}`);
        }
        done++;
        fill.style.width = `${Math.round((done / total) * 100)}%`;
      }
      text.textContent = `已完成 ${done}/${total}`;
      setTimeout(() => progress.classList.remove('show'), 1200);
      loadFiles();
    }

    $('uploadBtn').addEventListener('click', () => fileInput.click());
    $('refreshBtn').addEventListener('click', loadFiles);
    $('adminBtn') && $('adminBtn').addEventListener('click', enterAdmin);
    $('exitAdminBtn') && $('exitAdminBtn').addEventListener('click', exitAdmin);
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) uploadFiles(e.target.files);
      e.target.value = '';
    });

    if (new URLSearchParams(location.search).has('admin')) {
      enterAdmin();
    } else {
      applyAdminUi();
      loadFiles();
    }
  </script>
</body>
</html>

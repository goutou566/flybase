<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flybase</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .logo span { color: var(--accent); }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .breadcrumb {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--border); }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    button.ghost:hover { color: var(--text); border-color: var(--muted); }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .empty { padding: 48px; text-align: center; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(56, 189, 248, 0.05); }
    .name { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .name svg { flex-shrink: 0; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .actions button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }
    .actions button:hover { color: var(--text); }
    .actions button.danger:hover { color: var(--danger); border-color: var(--danger); }
    .size, .date { color: var(--muted); }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #fileInput { display: none; }
    .progress { display: none; margin-top: 12px; }
    .progress.show { display: block; }
    .progress-list { display: flex; flex-direction: column; gap: 8px; }
    .upload-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .upload-item.failed { border-color: var(--danger); }
    .upload-item .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .upload-item .fname {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upload-item .pct { font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .upload-item .pct.ok { color: #4ade80; }
    .upload-item .pct.err { color: var(--danger); }
    .bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar > div {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.15s linear;
    }
    .progress p { font-size: 12px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">fly<span>base</span></div>
    <div style="display:flex;gap:8px">
      <button class="ghost" id="adminBtn" style="display:none">管理员登录</button>
      <button class="ghost" id="exitAdminBtn" style="display:none">退出管理</button>
      <button class="ghost" id="refreshBtn">刷新</button>
      <button id="uploadBtn">上传文件</button>
    </div>
    <input type="file" id="fileInput" multiple />
  </header>

  <main>
    <div class="toolbar">
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>

    <div class="progress" id="progress">
      <div class="progress-list" id="progressList"></div>
      <p id="progressText"></p>
    </div>

    <div class="card">
      <div class="empty" id="empty">此目录为空，点击右上角「上传文件」</div>
      <table id="fileTable" style="display:none">
        <thead>
          <tr>
            <th>名称</th>
            <th>大小</th>
            <th>修改时间</th>
            <th style="text-align:right">操作</th>
          </tr>
        </thead>
        <tbody id="fileList"></tbody>
      </table>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      current: [], // folder path segments
      admin: false,
      authHeader: null,
    };

    function enterAdmin() {
      const pass = prompt('请输入管理员密码');
      if (!pass) return;
      state.admin = true;
      state.authHeader = 'Basic ' + btoa('admin:' + pass);
      applyAdminUi();
      toast('管理员模式已开启');
    }

    function exitAdmin() {
      state.admin = false;
      state.authHeader = null;
      applyAdminUi();
    }

    function applyAdminUi() {
      $('uploadBtn').style.display = state.admin ? '' : 'none';
      $('adminBtn').style.display = state.admin ? 'none' : '';
      $('exitAdminBtn').style.display = state.admin ? '' : 'none';
      loadFiles();
    }

    function authedFetch(url, options = {}) {
      if (state.admin && state.authHeader) {
        options.headers = { ...(options.headers || {}), Authorization: state.authHeader };
      }
      return fetch(url, options);
    }

    const $ = (id) => document.getElementById(id);
    const fileInput = $('fileInput');

    const ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>`;

    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function currentPrefix() {
      return state.current.length ? state.current.join('/') + '/' : '';
    }

    function encodeKey(key) {
      return encodeURIComponent(key);
    }

    function formatSize(bytes) {
      if (bytes == null) return '—';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      let n = bytes;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString();
    }

    function nameOf(key) {
      const parts = key.split('/');
      return parts[parts.length - 1] || parts[parts.length - 2] || '';
    }

    function renderBreadcrumb() {
      const bc = $('breadcrumb');
      let html = '<a href="#" data-ix="-1">根目录</a>';
      state.current.forEach((seg, i) => {
        html += `<span class="sep">/</span><a href="#" data-ix="${i}">${seg}</a>`;
      });
      bc.innerHTML = html;
      bc.querySelectorAll('a').forEach((a) => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const ix = parseInt(a.dataset.ix, 10);
          state.current = ix < 0 ? [] : state.current.slice(0, ix + 1);
          loadFiles();
        });
      });
    }

    async function loadFiles() {
      renderBreadcrumb();
      const prefix = currentPrefix();
      try {
        const res = await fetch(`/api/objects?prefix=${encodeURIComponent(prefix)}`);
        if (!res.ok) throw new Error(await res.text());
        const { objects } = await res.json();

        const folders = new Map();
        const files = [];
        objects.forEach((obj) => {
          const rest = obj.key.slice(prefix.length);
          if (rest.includes('/')) {
            const folder = rest.split('/')[0];
            if (!folders.has(folder)) {
              folders.set(folder, obj.lastModified);
            }
          } else {
            files.push(obj);
          }
        });

        const tbody = $('fileList');
        const empty = $('empty');
        const table = $('fileTable');

        if (folders.size === 0 && files.length === 0) {
          table.style.display = 'none';
          empty.style.display = 'block';
          return;
        }

        table.style.display = '';
        empty.style.display = 'none';
        tbody.innerHTML = '';

        for (const [folder, lastModified] of folders) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>${folder}</span></td>
            <td class="size">—</td>
            <td class="date">${formatDate(lastModified)}</td>
            <td></td>`;
          tr.querySelector('.name').addEventListener('click', () => {
            state.current.push(folder);
            loadFiles();
          });
          tbody.appendChild(tr);
        }

        files.forEach((obj) => {
          const tr = document.createElement('tr');
          const key = obj.key;
          const name = nameOf(key);
          tr.innerHTML = `
            <td><span class="name">${ICON}<span></span></span></td>
            <td class="size">${formatSize(obj.size)}</td>
            <td class="date">${formatDate(obj.lastModified)}</td>
            <td><div class="actions">
              <button data-act="download">下载</button>
              <button data-act="share">分享</button>
              ${state.admin ? '<button data-act="delete" class="danger">删除</button>' : ''}
            </div></td>`;
          tr.querySelector('.name span span').textContent = name;
          tr.querySelector('.name').addEventListener('click', () => {
            window.open(`/api/objects/${encodeKey(key)}`, '_blank');
          });
          const actions = tr.querySelector('.actions');
          actions.querySelector('[data-act=download]').addEventListener('click', () => {
            window.open(`/api/objects/${encodeKey(key)}`, '_blank');
          });
          actions.querySelector('[data-act=share]').addEventListener('click', async () => {
            try {
              const res = await fetch(`/api/objects/${encodeKey(key)}/share?expires=86400`);
              if (!res.ok) throw new Error(await res.text());
              const { shareUrl } = await res.json();
              await navigator.clipboard.writeText(shareUrl);
              toast('分享链接已复制（24 小时有效）');
            } catch {
              toast('生成分享链接失败');
            }
          });
          const delBtn = actions.querySelector('[data-act=delete]');
          if (delBtn) {
            delBtn.addEventListener('click', async () => {
              if (!confirm(`确认删除「${name}」？`)) return;
              try {
                const res = await authedFetch(`/api/objects/${encodeKey(key)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                toast('已删除');
                loadFiles();
              } catch {
                toast('删除失败');
              }
            });
          }
          tbody.appendChild(tr);
        });
      } catch (err) {
        toast('加载文件列表失败: ' + err.message);
      }
    }

    async function uploadOne(file, key, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', `/api/objects/${encodeKey(key)}`);
        if (state.admin && state.authHeader) {
          xhr.setRequestHeader('Authorization', state.authHeader);
        }
        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) onProgress(e.loaded, e.total);
        });
        xhr.addEventListener('load', () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve();
          } else {
            reject(new Error(`HTTP ${xhr.status}: ${xhr.responseText.slice(0, 200)}`));
          }
        });
        xhr.addEventListener('error', () => reject(new Error('网络错误')));
        xhr.addEventListener('timeout', () => reject(new Error('请求超时')));
        xhr.send(file);
      });
    }

    async function uploadWithRetry(file, key, onProgress, maxRetries = 2) {
      let lastErr;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          await uploadOne(file, key, onProgress);
          return;
        } catch (err) {
          lastErr = err;
          if (attempt < maxRetries) {
            const waitMs = 1500 * (attempt + 1);
            onProgress(0, file.size, `重试 ${attempt + 1}/${maxRetries}（${waitMs / 1000}s 后）`);
            await new Promise((r) => setTimeout(r, waitMs));
          }
        }
      }
      throw lastErr;
    }

    function formatBytes(n) {
      return formatSize(n);
    }

    const MULTIPART_THRESHOLD = 32 * 1024 * 1024; // 32MB 以上走分片直传
    const PART_SIZE = 8 * 1024 * 1024;            // 每片 8MB
    const PART_CONCURRENCY = 3;

    async function mpRequest(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (state.admin && state.authHeader) {
        headers.Authorization = state.authHeader;
      }
      const res = await fetch(path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function uploadPartWithRetry(presignPath, blob, onPartProgress, maxRetries = 3) {
      let lastErr;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          return await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', presignPath);
            xhr.upload.addEventListener('progress', (e) => {
              if (e.lengthComputable) onPartProgress(e.loaded);
            });
            xhr.addEventListener('load', () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve(xhr.getResponseHeader('ETag') || '');
              } else {
                reject(new Error(`HTTP ${xhr.status}`));
              }
            });
            xhr.addEventListener('error', () => reject(new Error('网络错误')));
            xhr.addEventListener('timeout', () => reject(new Error('超时')));
            xhr.send(blob);
          });
        } catch (err) {
          lastErr = err;
          if (attempt < maxRetries) {
            await new Promise((r) => setTimeout(r, 1000 * (attempt + 1)));
          }
        }
      }
      throw lastErr;
    }

    async function uploadMultipart(file, key, onProgress, onNote, signalRef) {
      const init = await mpRequest(`/api/multipart/${encodeKey(key)}?action=init`, {
        method: 'POST',
        headers: { 'Content-Type': file.type || 'application/octet-stream' },
      });
      signalRef.abort = async () => {
        try {
          await mpRequest(`/api/multipart/${encodeKey(key)}?action=abort`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uploadId: init.uploadId }),
          });
        } catch {}
      };

      const totalParts = Math.ceil(file.size / PART_SIZE);
      const parts = new Array(totalParts).fill(null);
      let completedBytes = 0;
      const partLoaded = new Array(totalParts).fill(0);

      const updateTotal = () => onProgress(completedBytes + partLoaded.reduce((a, b) => a + b, 0), file.size);

      const worker = async (queue) => {
        while (queue.length) {
          const i = queue.shift();
          const start = i * PART_SIZE;
          const blob = file.slice(start, Math.min(start + PART_SIZE, file.size));
          try {
            const { presignedUrl } = await mpRequest(
              `/api/multipart/${encodeKey(key)}?action=presign&uploadId=${encodeURIComponent(init.uploadId)}&partNumber=${i + 1}`
            );
            const etag = await uploadPartWithRetry(presignedUrl, blob, (loaded) => {
              partLoaded[i] = loaded;
              updateTotal();
            });
            parts[i] = { partNumber: i + 1, etag };
            partLoaded[i] = blob.size;
            completedBytes += blob.size;
            partLoaded[i] = 0;
            updateTotal();
          } catch (err) {
            if (signalRef.abort) await signalRef.abort();
            throw new Error(`第 ${i + 1} 片上传失败: ${err.message}`);
          }
        }
      };

      const queue = Array.from({ length: totalParts }, (_, i) => i);
      await Promise.all(
        Array.from({ length: Math.min(PART_CONCURRENCY, totalParts) }, () => worker(queue))
      );

      onNote?.('正在合并分片...');
      await mpRequest(`/api/multipart/${encodeKey(key)}?action=complete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          uploadId: init.uploadId,
          parts: parts.filter(Boolean),
        }),
      });
    }

    async function uploadFiles(files) {
      const list = Array.from(files);
      const progress = $('progress');
      const listBox = $('progressList');
      const text = $('progressText');
      progress.classList.add('show');

      const items = list.map((file) => {
        const el = document.createElement('div');
        el.className = 'upload-item';
        el.innerHTML = `
          <div class="row">
            <span class="fname"></span>
            <span class="pct">0%</span>
          </div>
          <div class="bar"><div></div></div>`;
        el.querySelector('.fname').textContent =
          `${file.name}（${formatBytes(file.size)}${file.size > MULTIPART_THRESHOLD ? '，分片直传' : ''}）`;
        listBox.appendChild(el);
        return { file, el };
      });

      let okCount = 0;
      const failNames = [];

      await Promise.all(items.map(async ({ file, el }) => {
        const key = currentPrefix() + file.name;
        const fill = el.querySelector('.bar > div');
        const pct = el.querySelector('.pct');
        const signalRef = {};
        const showProgress = (loaded, total, note) => {
          if (note) {
            pct.textContent = note;
            fill.style.width = '100%';
            fill.style.opacity = '0.3';
            return;
          }
          const p = total ? Math.round((loaded / total) * 100) : 0;
          fill.style.width = `${p}%`;
          fill.style.opacity = '';
          pct.textContent = `${formatBytes(loaded)} / ${formatBytes(total)}`;
        };
        try {
          if (file.size > MULTIPART_THRESHOLD) {
            await uploadMultipart(file, key, showProgress, (note) => showProgress(0, 0, note), signalRef);
          } else {
            await uploadWithRetry(file, key, showProgress);
          }
          fill.style.width = '100%';
          pct.textContent = '完成';
          pct.classList.add('ok');
          okCount++;
        } catch (err) {
          el.classList.add('failed');
          pct.textContent = '失败: ' + (err.message || '未知错误').slice(0, 80);
          pct.classList.add('err');
          failNames.push(file.name);
        }
      }));

      if (failNames.length === 0) {
        text.textContent = `全部完成（${okCount} 个文件）`;
      } else {
        text.textContent = `成功 ${okCount}/${list.length}，失败：${failNames.join('、')}`;
      }
      setTimeout(() => {
        progress.classList.remove('show');
        listBox.innerHTML = '';
      }, 4000);
      loadFiles();
    }

    $('uploadBtn').addEventListener('click', () => fileInput.click());
    $('refreshBtn').addEventListener('click', loadFiles);
    $('adminBtn') && $('adminBtn').addEventListener('click', enterAdmin);
    $('exitAdminBtn') && $('exitAdminBtn').addEventListener('click', exitAdmin);
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) uploadFiles(e.target.files);
      e.target.value = '';
    });

    if (new URLSearchParams(location.search).has('admin')) {
      enterAdmin();
    } else {
      applyAdminUi();
      loadFiles();
    }
  </script>
</body>
</html>
